name: Release

# Same shape as the OpenTV pipeline: a tag is a release, and CI builds it signed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform for this build
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      # No keys here, on purpose: this repository is public, so a release APK is public, and anything baked into it
      # can be read out of the file. The TMDB and API-Football keys live in config.properties on the machine that
      # builds for the TV, and in the app's own settings on the TV. A release built here is the code, nothing personal.
      - name: Settings (no keys)
        run: cp config.example.properties config.properties

      # Same key as every install out there: an update signed with anything else is rejected by
      # Android (INSTALL_FAILED_UPDATE_INCOMPATIBLE), and the person would have to reinstall.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::No KEYSTORE_BASE64 secret: add freemytv.keystore (base64 -w0) so releases keep updating in place."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > freemytv.keystore

      - name: Build
        run: ./build.sh

      - name: Check the APK was signed
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs FreeMyTV.apk | head -2

      - name: Name the artifact
        id: artifact
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp FreeMyTV.apk "dist/freemytv-${TAG}.apk"
          cp FreeMyTV.apk dist/FreeMyTV.apk
          echo "path=dist/freemytv-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
